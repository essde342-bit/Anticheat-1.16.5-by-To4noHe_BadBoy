name: Build EssGuard 1.16.5

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create complete EssGuard project
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname 'pom.xml')"
          echo '' | base64 -d > 'pom.xml'          mkdir -p "$(dirname 'src/main/resources/plugin.yml')"
          echo '' | base64 -d > 'src/main/resources/plugin.yml'          mkdir -p "$(dirname 'src/main/resources/config.yml')"
          echo '' | base64 -d > 'src/main/resources/config.yml'          mkdir -p "$(dirname 'src/main/java/me/essde/essguard/PlayerData.java')"
          echo '' | base64 -d > 'src/main/java/me/essde/essguard/PlayerData.java'          mkdir -p "$(dirname 'src/main/java/me/essde/essguard/EssGuard.java')"
          echo '' | base64 -d > 'src/main/java/me/essde/essguard/EssGuard.java'          mkdir -p "$(dirname 'src/main/java/me/essde/essguard/ViolationManager.java')"
          echo '' | base64 -d > 'src/main/java/me/essde/essguard/ViolationManager.java'          mkdir -p "$(dirname 'src/main/java/me/essde/essguard/checks/CombatCheck.java')"
          echo '' | base64 -d > 'src/main/java/me/essde/essguard/checks/CombatCheck.java'          mkdir -p "$(dirname 'src/main/java/me/essde/essguard/checks/MovementCheck.java')"
          echo '' | base64 -d > 'src/main/java/me/essde/essguard/checks/MovementCheck.java'
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build JAR
        run: mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EssGuard-1.16.5-JAR
          path: target/*.jar
          if-no-files-found: error
