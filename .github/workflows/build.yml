name: Build EssGuard 1.16.5

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build JAR
        run: mvn -B clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EssGuard-1.16.5-JAR
          path: target/*.jar
          if-no-files-found: error