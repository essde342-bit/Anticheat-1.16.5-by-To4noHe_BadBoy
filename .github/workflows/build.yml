name: Build EssGuard

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.java'
      - 'pom.xml'
      - 'src/main/resources/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: EssGuard-1.16.5
          path: target/EssGuard-1.16.5.jar